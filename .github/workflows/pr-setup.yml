# Builds SqlVitals Setup for every pull request so reviewers can download and try the installer.
# The release number comes from <Version> in SqlVitals/Desktop/SqlVitals.Desktop.csproj.
# A draft PR runs the tests only; Setup is built once it's marked ready for review (#230).
name: PR – Build SqlVitals Setup

# A docs-only PR has nothing to test or build. LICENSE isn't ignored: Setup embeds it.
# No required status check waits on this workflow, so a skipped run doesn't block a merge.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: write   # the coverage comment

# A new push to the PR supersedes the build still running for the previous one.
concurrency:
  group: pr-setup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-setup:
    name: Build Setup
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read release number
        id: version
        shell: pwsh
        run: |
          [xml] $proj = Get-Content SqlVitals/Desktop/SqlVitals.Desktop.csproj
          $version = @($proj.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if (-not $version) { throw 'No <Version> in SqlVitals.Desktop.csproj' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Release number: $version"

      # Tests run before the payload exists, so they don't carry the ~80 MB package. The build treats
      # warnings as errors (Directory.Build.props), so a new warning fails here too.
      - name: Test with coverage
        shell: pwsh
        run: ./.github/scripts/Test-WithCoverage.ps1

      # One comment per PR, updated by each run; found by the marker on its first line.
      - name: Post coverage on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true   # a GitHub API hiccup mustn't cost the PR its Setup build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          $repo = '${{ github.repository }}'
          $id = gh api "repos/$repo/issues/$env:PR/comments" --paginate `
                  --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- sqlvitals-coverage -->"))) | .id' | Select-Object -Last 1
          if ($id) { gh api -X PATCH "repos/$repo/issues/comments/$id" -F body=@artifacts/coverage/comment.md | Out-Null }
          else     { gh pr comment $env:PR --body-file artifacts/coverage/comment.md }

      - name: Draft, so no Setup
        if: github.event.pull_request.draft
        shell: pwsh
        run: |
          "Draft PR: tests only. Setup is built when the PR is marked **Ready for review**." |
            Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Unsigned: signing secrets aren't available to pull requests (and never to forks).
      # No portable zip: it holds the same app as Setup, and only releases ship it (#230).
      - name: Build SqlVitals Setup ${{ steps.version.outputs.version }}
        if: ${{ !github.event.pull_request.draft }}
        shell: pwsh
        run: ./SqlVitals/Installer/Build-Installer.ps1 -Configuration Release -SkipPortable

      - name: Check output
        if: ${{ !github.event.pull_request.draft }}
        shell: pwsh
        run: |
          $exe = "artifacts/SqlVitals-Setup-${{ steps.version.outputs.version }}.exe"
          $collector = "artifacts/SqlVitals-Collector-${{ steps.version.outputs.version }}-win-x64.zip"
          foreach ($file in $exe, $collector) {
            if (-not (Test-Path $file)) { throw "Expected $file was not produced." }
          }
          $info    = Get-Item $exe
          $hash    = (Get-Content "$exe.sha256").Split(' ')[0]
          $colInfo = Get-Item $collector
          $colHash = (Get-Content "$collector.sha256").Split(' ')[0]
          @(
            "### SqlVitals ${{ steps.version.outputs.version }}"
            ""
            "| | Setup | Collector service |"
            "|---|---|---|"
            "| File | ``$($info.Name)`` | ``$($colInfo.Name)`` |"
            "| Size | $([math]::Round($info.Length / 1MB, 1)) MB | $([math]::Round($colInfo.Length / 1MB, 1)) MB |"
            "| SHA-256 | ``$hash`` | ``$colHash`` |"
            ""
            "Commit ``${{ github.event.pull_request.head.sha }}``"
            ""
            "Download them from **Artifacts** below. They're kept for a few days only; re-run this workflow to build them again. They are unsigned, so Windows SmartScreen may ask you to confirm (More info → Run anyway)."
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Artifact storage is billed (#230), so a PR keeps only what a reviewer tries, for 3 days.
      # The repository's retention setting caps this and can make it shorter.
      - name: Upload Setup artifact
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/upload-artifact@v4
        with:
          name: SqlVitals-Setup-${{ steps.version.outputs.version }}-pr${{ github.event.pull_request.number }}
          path: |
            artifacts/SqlVitals-Setup-${{ steps.version.outputs.version }}.exe
            artifacts/SqlVitals-Setup-${{ steps.version.outputs.version }}.exe.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0   # the exe is already compressed

      - name: Upload collector artifact
        if: ${{ !github.event.pull_request.draft }}
        uses: actions/upload-artifact@v4
        with:
          name: SqlVitals-Collector-${{ steps.version.outputs.version }}-win-x64-pr${{ github.event.pull_request.number }}
          path: |
            artifacts/SqlVitals-Collector-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/SqlVitals-Collector-${{ steps.version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 3
          compression-level: 0   # the zip is already compressed
