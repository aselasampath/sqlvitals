# Runs the repositories' SQL against real SQL Servers (#46): SqlVitals.Engine.IntegrationTests,
# once per supported version, each against that version's Linux container. Every repository
# method runs at least once (RepositoryCoverageTests checks that), so a DMV query that fails on
# one version, or returns a column of another type than the code reads, fails here.
name: SQL Server integration tests

# Only a change the SQL can feel runs it (#230): the engine, these tests, the build rules (a new
# warning fails the build) or this file. Keep the two paths lists the same. No version tags: a tag
# points at a commit main has just tested. workflow_dispatch runs it on demand, e.g. before tagging
# a release. The weekly run catches what changes without a commit: a new CU in the :<version>-latest
# images, or a new 10.0.x SDK whose analyzers add a warning.
# No required status check waits on this workflow, so a skipped run doesn't block a merge.
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'SqlVitals/Engine/**'
      - 'SqlVitals/Engine.IntegrationTests/**'
      - 'Directory.Build.props'
      - '.editorconfig'
      - '.github/workflows/sql-integration.yml'
  push:
    branches: [main]
    paths:
      - 'SqlVitals/Engine/**'
      - 'SqlVitals/Engine.IntegrationTests/**'
      - 'Directory.Build.props'
      - '.editorconfig'
      - '.github/workflows/sql-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run still going for the previous one.
concurrency:
  group: sql-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql-server:
    name: SQL Server ${{ matrix.sql }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false   # one version's failure shouldn't hide another's
      matrix:
        sql: ['2017', '2019', '2022', '2025']

    # Developer edition with Agent, so the Agent Jobs queries have jobs to read. The container
    # lives only as long as the job, so its sa password is no secret.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.sql }}-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_AGENT_ENABLED: 'true'
          MSSQL_SA_PASSWORD: 'SqlVitals-CI-2026!'
        ports:
          - 1433:1433

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # The fixture waits for the server to accept logins, then builds the SqlVitalsIT database.
      SQLVITALS_TEST_SERVER: 'Server=localhost,1433;User ID=sa;Password=SqlVitals-CI-2026!;Encrypt=True;TrustServerCertificate=True'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The build treats warnings as errors (Directory.Build.props), as on Windows.
      - name: Run the SQL against SQL Server ${{ matrix.sql }}
        run: >
          dotnet test SqlVitals/Engine.IntegrationTests/SqlVitals.Engine.IntegrationTests.csproj -c Release
          --logger "console;verbosity=normal" --logger "trx;LogFileName=sql-${{ matrix.sql }}.trx"
          --results-directory artifacts/sql-integration

      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sql-integration-${{ matrix.sql }}
          path: artifacts/sql-integration
          retention-days: 3
